<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - LUMINARY</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">LUMINARY</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
            </ul>
        </div>
    </nav>

    <div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
        <div class="auth-card">
            <h2 style="text-align: center; margin-bottom: 1rem; font-size: 1.8rem;">Reset Password</h2>
            <p style="text-align: center; color: var(--color-text-muted); margin-bottom: 2rem;">Enter your email to
                receive a reset token.</p>

            <form id="forgot-password-form">
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label for="email" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Email</label>
                    <input type="email" id="email" required>
                </div>
                <!-- Logic for entering token and new password will be revealed after submitting email -->
                <div id="reset-section" style="display: none;">
                    <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label for="token" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Reset
                            Token</label>
                        <input type="text" id="token">
                        <small style="color: var(--color-text-muted);">Check the server console for the token.</small>
                    </div>
                    <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label for="new-password" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">New
                            Password</label>
                        <input type="password" id="new-password">
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="btn btn-primary"
                    style="width: 100%; justify-content: center;">Send Reset Link</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
