<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LUMINARY</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">LUMINARY</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
            </ul>
        </div>
    </nav>

    <div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
        <div class="auth-card">
            <h2 style="text-align: center; margin-bottom: 2rem; font-size: 1.8rem;">Welcome Back</h2>
            <form id="login-form">
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label for="email" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label for="password"
                        style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Password</label>
                    <input type="password" id="password" required>
                    <div style="text-align: right; margin-top: 0.5rem;">
                        <a href="forgot-password.html"
                            style="font-size: 0.85rem; color: var(--color-electric-blue);">Forgot Password?</a>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary"
                    style="width: 100%; justify-content: center;">Login</button>
            </form>
            <p style="text-align: center; margin-top: 1.5rem; color: var(--color-text-muted);">
                Don't have an account? <a href="register.html"
                    style="color: var(--color-electric-blue); font-weight: 600;">Sign Up</a>
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
